<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campus Help Desk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Campus Help Desk</h1>
            <p>Submit and manage your campus-related problems or requests.</p>
        </header>


        <!-- Request Form -->

        <section class="form-section">

            <h2 id="formTitle">Submit a Request</h2>

            <form id="requestForm">

                <input
                    type="hidden"
                    id="requestId"
                >

                <div class="form-group">

                    <label for="studentName">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Wi-Fi">
                            Wi-Fi
                        </option>

                        <option value="Library">
                            Library
                        </option>

                        <option value="Classroom">
                            Classroom
                        </option>

                        <option value="Hostel">
                            Hostel
                        </option>

                        <option value="Fees">
                            Fees
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Problem Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Describe your problem"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority" required>

                        <option value="">
                            Select Priority
                        </option>

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        id="submitButton"
                    >
                        Submit Request
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="cancel-btn"
                        style="display: none;"
                    >
                        Cancel Edit
                    </button>

                </div>

            </form>

        </section>


        <!-- Requests -->

        <section class="requests-section">

            <h2>Submitted Requests</h2>

            <div id="requestsContainer">
                Loading requests...
            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
